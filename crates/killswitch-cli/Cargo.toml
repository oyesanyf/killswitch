[package]
name = "killswitch-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line interface and unified start.exe loader for Rust KillSwitch"

[[bin]]
name = "killswitch"
path = "src/bin/killswitch.rs"

[[bin]]
name = "start"
path = "src/bin/start.rs"

[dependencies]
# Internal workspace crates
killswitch-types = { workspace = true }
killswitch-core = { workspace = true }
killswitch-adjudication = { workspace = true }
killswitch-telemetry = { workspace = true }
killswitch-orchestrator = { workspace = true }
killswitch-server = { workspace = true }

# Web & async runtime
axum = { workspace = true, features = ["macros"] }
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
async-trait = { workspace = true }
tower = { workspace = true, features = ["util"] }
tempfile = { workspace = true }

# Logging & diagnostics
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
chrono = { workspace = true, features = ["serde"] }

# Cryptography & hashing
blake3 = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
