name: Cross-Platform Release (Windows MSI, Linux, macOS)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Windows x86_64 & MSI Installer
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows Release Binaries
        run: cargo build --release --workspace
      - name: Build Windows MSI (Zero-Touch PATH)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          New-Item -ItemType Directory -Force -Path release-out | Out-Null
          wix build installer/killswitch.wxs -arch x64 -out release-out/KillSwitch-0.1.0-x86_64.msi
          Copy-Item target/release/killswitch.exe release-out/killswitch-0.1.0-windows-x86_64.exe
          Copy-Item target/release/start.exe release-out/start-0.1.0-windows-x86_64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: release-out/*

  build-linux:
    name: Linux x86_64 (.tar.gz & .deb)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Linux Release Binaries
        run: cargo build --release --workspace
      - name: Package Linux Tarball & Deb
        run: |
          mkdir -p release-out stage-deb/usr/bin stage-deb/DEBIAN
          cp target/release/killswitch stage-deb/usr/bin/killswitch
          cp target/release/start stage-deb/usr/bin/killswitch-start
          chmod 0755 stage-deb/usr/bin/*
          cat > stage-deb/DEBIAN/control << 'EOF'
          Package: killswitch
          Version: 0.1.0
          Section: security
          Priority: optional
          Architecture: amd64
          Maintainer: KillSwitch Security <security@killswitch.local>
          Description: KillSwitch Autonomous EDR, Stateful Lineage & Multi-Source Conformal Guard
          EOF
          dpkg-deb --build stage-deb release-out/killswitch_0.1.0_amd64.deb
          tar -czf release-out/killswitch-0.1.0-linux-x86_64.tar.gz -C target/release killswitch start
      - uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: release-out/*

  build-macos:
    name: macOS (.tar.gz & .pkg)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build macOS Release Binaries
        run: cargo build --release --workspace
      - name: Package macOS Tarball & Pkg
        run: |
          mkdir -p release-out pkgroot/usr/local/bin
          cp target/release/killswitch pkgroot/usr/local/bin/killswitch
          cp target/release/start pkgroot/usr/local/bin/killswitch-start
          tar -czf release-out/killswitch-0.1.0-macos-universal.tar.gz -C target/release killswitch start
          pkgbuild --root pkgroot --identifier io.killswitch.agent --version 0.1.0 release-out/KillSwitch-0.1.0-macos-universal.pkg
      - uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts
          path: release-out/*

  publish-release:
    name: Publish GitHub Release Assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
