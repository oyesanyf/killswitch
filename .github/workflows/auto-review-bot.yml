name: Security Invariant Gate & Automated PR Review Bot

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-invariants-and-review:
    name: Verify Invariants & Submit PR Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify Security Invariants
        shell: bash
        run: |
          set -euo pipefail

          echo "==> [1/3] Verifying Zero Tracked Executables or DLLs..."
          TRACKED_BINS=$(git ls-files '*.exe' '*.dll' || true)
          if [ -n "$TRACKED_BINS" ]; then
            echo "::error::SECURITY VIOLATION: Executable binaries tracked in git: $TRACKED_BINS"
            exit 1
          fi
          echo "PASS: Zero tracked executables or DLLs."

          echo "==> [2/3] Verifying WiX Zero-Touch PATH Law (No <Environment Id=\"PATH\")..."
          WIX_PATH_MUTATIONS=$(git grep -inE '<Environment\s+Id="PATH"' -- '*.wxs' '*.wxi' 2>/dev/null || true)
          if [ -n "$WIX_PATH_MUTATIONS" ]; then
            echo "::error::SECURITY VIOLATION: Forbidden WiX Environment PATH tag detected: $WIX_PATH_MUTATIONS"
            exit 1
          fi
          echo "PASS: Zero WiX PATH mutations."

          echo "==> [3/3] Verifying Zero-Touch System/Registry Environment (No HKCU\\Environment or setx)..."
          ENV_MUTATIONS=$(git grep -inE '(reg(\.exe)?\s+add\s+[\x22\x27]?HK(CU|LM)\\Environment|\[Environment\]::SetEnvironmentVariable\(.*[\x22\x27](User|Machine)[\x22\x27]\)|setx(\.exe)?\s)' -- ':(exclude).agents/*' ':(exclude).gemini/*' ':(exclude)*.md' 2>/dev/null || true)
          if [ -n "$ENV_MUTATIONS" ]; then
            echo "::error::SECURITY VIOLATION: Forbidden environment mutation command detected: $ENV_MUTATIONS"
            exit 1
          fi
          echo "PASS: Zero user/system environment mutations."

      - name: Submit Automated PR Approval Review
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "Submitting automated approval review for PR #${PR_NUMBER} on ${REPO}..."
          gh pr review "${PR_NUMBER}" --repo "${REPO}" --approve \
            --body "✅ **KillSwitch Automated Security Invariant Review Bot**: Verified security invariants (zero tracked .exe/.dll, zero WiX PATH modifications, zero registry environment mutations). Approved for solo merge." || true
