{
  "options": {
    "logger_path": "logs/siquery",
    "disable_events": "false",
    "schedule_splay_percent": "10"
  },
  "schedule": {
    "ai_agent_inference_sockets": {
      "query": "SELECT p.pid, p.name, p.path, p.cmdline, p.parent, s.remote_address, s.remote_port, s.state FROM processes p JOIN process_open_sockets s ON p.pid = s.pid WHERE s.remote_port IN (11434, 1234, 8000, 8080, 5000) OR (s.remote_port = 443 AND (p.cmdline LIKE '%mcp%' OR p.cmdline LIKE '%jsonrpc%'));",
      "interval": 30,
      "description": "Continuous relational discovery of processes with active LLM inference sockets or streaming MCP connections"
    },
    "ai_agent_mcp_pipe_hierarchy": {
      "query": "SELECT p.pid, p.name, p.parent, p.cmdline, c.pid AS child_pid, c.name AS child_name, c.cmdline AS child_cmdline FROM processes p JOIN processes c ON c.parent = p.pid WHERE p.pid IN (SELECT pid FROM pipes WHERE name LIKE '%mcp%' OR name LIKE '%AnonymousPipe%' OR flags LIKE '%PIPE%');",
      "interval": 30,
      "description": "Continuous discovery of agent processes spawning child subprocesses via non-interactive stdio / MCP JSON-RPC pipes"
    },
    "ai_agent_breakout_sensitive_access": {
      "query": "SELECT p.pid, p.name, p.parent, p.cmdline, p.cwd FROM processes p WHERE p.cmdline LIKE '%169.254.169.254%' OR p.cmdline LIKE '%\\config\\SAM%' OR p.cmdline LIKE '%comsvcs.dll%' OR p.cmdline LIKE '%MiniDump%';",
      "interval": 15,
      "description": "Detection of hard AI agent breakout indicators: AWS metadata SSRF, SAM credential dumping, and minidump scraping"
    },
    "incident_a_circumvention_retries": {
      "query": "SELECT signal_id, session_id, pid, command_line, privilege_class, pattern_kind, timestamp_utc FROM circumvention_events WHERE is_permission_denied = 1;",
      "interval": 10,
      "description": "Detection of repeated privilege escalation and Incident A cross-boundary circumvention retries"
    },
    "dlp_semantic_taint_egress": {
      "query": "SELECT d.event_id, d.timestamp_utc, d.kind, d.classification, d.policy, d.snippet, s.remote_address, s.remote_port FROM dlp_semantic_events d CROSS JOIN process_open_sockets s WHERE s.remote_port IN (443, 80, 8080);",
      "interval": 15,
      "description": "Relational correlation of active semantic DLP entity reads with active outbound network sockets"
    },
    "agentsonar_shadow_ai_flows": {
      "query": "SELECT e.timestamp, e.pid, e.proc, e.cmdline, p.parent AS parent_pid, e.domain, e.remote_ip, e.remote_port, e.bytes_in, e.bytes_out, e.packets_in, e.duration_ms, e.ai_score FROM agentsonar_events e LEFT JOIN processes p ON e.pid = p.pid WHERE e.agent = '' AND e.is_noise = 0 AND e.ai_score >= 0.70 ORDER BY e.ai_score DESC;",
      "interval": 15,
      "description": "Dynamic AgentSonar relational discovery of unclassified high-scoring SSE LLM streaming flows joined with host process lineage"
    }
  }
}
